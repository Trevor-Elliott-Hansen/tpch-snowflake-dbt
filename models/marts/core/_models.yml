version: 2

models:

  - name: dim_customer
    description: >
      Customer dimension, denormalized with nation and region for query
      ergonomics in BI tools. One row per customer (current state).
    columns:
      - name: customer_key
        description: Primary key.
        data_tests:
          - unique
          - not_null
      - name: nation_key
        description: FK to stg_tpch__nations.
        data_tests:
          - not_null
      - name: region_key
        description: FK to stg_tpch__regions.
        data_tests:
          - not_null
      - name: customer_name
        data_tests: [not_null]
      - name: market_segment
        description: >
          Customer market segment: AUTOMOBILE, BUILDING, FURNITURE,
          HOUSEHOLD, or MACHINERY.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  ['AUTOMOBILE', 'BUILDING', 'FURNITURE', 'HOUSEHOLD', 'MACHINERY']
      - name: account_balance
        description: Customer account balance. Can be negative (outstanding credit).
      - name: nation_name
        data_tests: [not_null]
      - name: region_name
        data_tests: [not_null]
      - name: customer_created_date
        description: >
          Derived from the customer's earliest order date. NULL if the
          customer has never placed an order.

  - name: dim_supplier
    description: >
      Supplier dimension, denormalized with nation and region. One row per
      supplier.
    columns:
      - name: supplier_key
        description: Primary key.
        data_tests:
          - unique
          - not_null
      - name: nation_key
        description: FK to stg_tpch__nations.
        data_tests:
          - not_null
      - name: region_key
        description: FK to stg_tpch__regions.
        data_tests:
          - not_null
      - name: supplier_name
        data_tests: [not_null]
      - name: account_balance
        description: Supplier account balance. Can be negative.
      - name: nation_name
        data_tests: [not_null]
      - name: region_name
        data_tests: [not_null]

  - name: dim_part
    description: >
      Part dimension. p_type is parsed into category / finish / material in
      stg_tpch__parts.
    columns:
      - name: part_key
        description: Primary key.
        data_tests:
          - unique
          - not_null
      - name: part_name
        data_tests: [not_null]
      - name: brand
        data_tests: [not_null]
      - name: part_type
        description: >
          Original composite type string. Parsed into part_category,
          part_finish, and part_material in staging.
      - name: part_category
        description: Parsed from p_type — last word (e.g. STEEL, BRASS).
      - name: part_finish
        description: Parsed from p_type — surface finish (e.g. POLISHED, BRUSHED).
      - name: part_material
        description: Parsed from p_type — base material (e.g. TIN, NICKEL).
      - name: retail_price
        description: List price.
        data_tests:
          - assert_positive_value

  - name: dim_customer_history
    description: >
      SCD Type 2 history of customer attributes, built from the
      customer_snapshot snapshot. One row per (customer_key, version).
      Filter on `is_current` for the latest version, or use
      `valid_from` / `valid_to_or_max` for point-in-time joins.
    columns:
      - name: customer_history_key
        description: Surrogate key for this version (dbt_scd_id from snapshot).
        data_tests:
          - unique
          - not_null
      - name: customer_key
        description: Natural key. Not unique in this table — unique per version.
        data_tests:
          - not_null
      - name: nation_key
        description: FK to nations at this version.
        data_tests:
          - not_null
      - name: account_balance
        description: Account balance at this version. Can be negative.
      - name: valid_from
        description: When this version became effective.
        data_tests:
          - not_null
      - name: valid_to
        description: When this version was superseded. NULL for the current version.
      - name: valid_to_or_max
        description: >
          Same as valid_to but with NULL replaced by 9999-12-31 for
          closed-range point-in-time joins.
      - name: is_current
        description: Boolean — true for the most recent version of each customer.
        data_tests:
          - not_null
